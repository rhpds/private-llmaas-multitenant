---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: models-as-a-service
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: maas-api
    name: in-cluster
  project: default
  source:
    path: deployment/overlays/openshift
    repoURL: https://github.com/opendatahub-io/models-as-a-service.git
    targetRevision: 8ee0617b3aa3efb0dad62a3a7f8a7f9e809948b0
    kustomize:
      patches:
        - target:
            kind: Gateway
            name: maas-default-gateway
          patch: |-
            - op: replace
              path: /spec/listeners/0/hostname
              value: maas.{{ .Values.deployer.domain }}
            - op: replace
              path: /spec/listeners/0/tls/certificateRefs/0/name
              value: cert-manager-ingress-cert
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
