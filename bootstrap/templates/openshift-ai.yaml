---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-ai
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: redhat-ods-operator
  project: default
  sources:
  - path: charts/openshift-ai
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: f6beed4b481d5345397fdbd8f6749c846181ee1e
    helm:
      valueFiles:
        - $values/deployments/openshift-ai/values.yaml
  - repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
